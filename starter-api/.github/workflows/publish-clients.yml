name: Publish clients

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLIENTS_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Export OpenAPI spec
        run: uv run python scripts/export_openapi.py --output openapi.json

      - name: Commit OpenAPI spec
        run: |
          git config user.name "ClauseHub-bot"
          git config user.email "bot@ClauseHub.io"
          git add openapi.json
          git diff --cached --quiet || git commit -m "chore: update openapi.json [skip ci]"
          git push

      - name: Upload spec as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

      - name: Trigger Python client regeneration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLIENTS_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: '${{ github.event.repository.name }}-client-py',
              workflow_id: 'regenerate.yml',
              ref: 'main',
              inputs: {
                spec_url: `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/openapi.json`,
                api_version: context.sha.substring(0, 7),
              }
            })

      - name: Trigger TypeScript client regeneration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLIENTS_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: '${{ github.event.repository.name }}-client-ts',
              workflow_id: 'regenerate.yml',
              ref: 'main',
              inputs: {
                spec_url: `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/openapi.json`,
                api_version: context.sha.substring(0, 7),
              }
            })
