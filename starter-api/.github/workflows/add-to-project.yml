# Adds new issues to the Mission Control board. Replace {MC_ORG} and
# {MC_PROJECT_NUMBER} with the values from ~/.config/pipeline-toolkit/config.env,
# or delete this workflow if Mission Control isn't used for this client.
name: Add to Mission Control

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/{MC_ORG}/projects/{MC_PROJECT_NUMBER}
          github-token: ${{ secrets.PROJECT_TOKEN }}
