name: starter-api
region: lon1

services:
  - name: api
    github:
      repo: ClauseHub/starter-api
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: LOG_LEVEL
        value: INFO
        scope: RUN_AND_BUILD_TIME
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SUPABASE_JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CORS_ORIGINS
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
        scope: RUN_AND_BUILD_TIME
