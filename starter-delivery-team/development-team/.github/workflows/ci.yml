# WHERE THIS FILE GOES
# GitHub only runs workflows from a repository's own .github/workflows/.
# In the usual layout the project workspace root (which holds infra/ and
# tests/) is NOT a git repo, so a copy there never triggers. Instead:
#   1. copy this file into each service repo's .github/workflows/
#   2. vendor the compose files it uses into that repo's .github/compose/,
#      rewriting `context: ../{service-1}` to `context: .` for the repo itself
#   3. change `working-directory: infra` / `-f infra/...` below to .github/compose
# If the workspace root IS the git repo (monorepo), use this file as-is.
# (Learned on Hearthstone, HEARTH-7.)

name: CI

on:
  push:
    branches:
      - "feature/**"
      - "ci"

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start CI environment
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.ci.yml \
            --env-file .env.ci \
            up --build --wait --wait-timeout 120

      # ── Unit tests (run inside container) ────────────────────────────────
      # Replace with your project's unit test command:
      #   Node.js:  docker compose exec -T {service} npm test
      #   Python:   docker compose exec -T {service} pytest tests/unit/ -v

      - name: Run unit tests
        run: |
          docker compose \
            -f infra/docker-compose.base.yml \
            -f infra/docker-compose.ci.yml \
            exec -T {SERVICE_WITH_TESTS} {UNIT_TEST_COMMAND}

      # ── Integration tests (run from host against containers) ─────────────
      # Replace with your project's integration test runner:
      #   Node.js:  npm install && npx playwright test tests/integration/
      #   Python:   pip install -r tests/requirements.txt && pytest tests/integration/

      - name: Run integration tests
        run: |
          {INSTALL_TEST_DEPS_COMMAND}
          {INTEGRATION_TEST_COMMAND}

      - name: Show logs on failure
        if: failure()
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.ci.yml \
            logs --tail=100

      - name: Tear down
        if: always()
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.ci.yml \
            down -v --remove-orphans
