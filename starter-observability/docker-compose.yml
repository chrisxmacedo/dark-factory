version: "3.8"

# Observability stack — Grafana + Loki + Tempo + Prometheus + OTel Collector
# Uses grafana/otel-lgtm all-in-one image for local development.
# For production, split into individual services (see README.md).

networks:
  observability:
    name: observability
    driver: bridge

services:
  # ──────────────────────────────────────────────
  # All-in-one: Grafana + Loki + Tempo + Prometheus + OTel Collector
  # ──────────────────────────────────────────────
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "${GRAFANA_PORT:-4000}:3000"           # Grafana UI
      - "${OTEL_GRPC_PORT:-4317}:4317"         # OTel Collector gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"         # OTel Collector HTTP
      - "${PROMETHEUS_PORT:-9090}:9090"        # Prometheus UI
    volumes:
      - ./otel-collector-config.yml:/otel-lgtm/otelcol-config.yaml:ro
      - ./alerts/rules.yml:/etc/prometheus/rules.yml:ro
      - grafana-data:/var/lib/grafana
      - prometheus-data:/var/lib/prometheus
      - loki-data:/var/lib/loki
      - tempo-data:/var/lib/tempo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/service-health.json
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - observability
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL metrics exporter
  # ──────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:-postgresql://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:5432/{DB_NAME}?sslmode=disable}
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      otel-lgtm:
        condition: service_healthy
    profiles:
      - exporters

  # ──────────────────────────────────────────────
  # Redis metrics exporter
  # ──────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      - REDIS_ADDR=${REDIS_EXPORTER_ADDR:-redis://{REDIS_HOST}:6379}
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      otel-lgtm:
        condition: service_healthy
    profiles:
      - exporters

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
