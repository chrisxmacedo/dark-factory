# Synthetic health checks
# Defines HTTP probes for each service type. Use with:
# - Grafana Synthetic Monitoring (cloud)
# - Prometheus Blackbox Exporter (self-hosted)
# - Any monitoring tool that accepts YAML probe definitions

defaults:
  interval: 30s
  timeout: 10s
  method: GET
  expected_status: 200

checks:
  # ── Web service (starter-web) ────────────────
  - name: "{PROJECT_NAME}-web"
    url: "{WEB_SERVICE_URL}/api/health"
    interval: 30s
    timeout: 10s
    expected_status: 200
    expected_body: '"status":"ok"'
    labels:
      service_type: web
      environment: "{ENVIRONMENT}"

  # ── API service (starter-api) ────────────────
  - name: "{PROJECT_NAME}-api"
    url: "{API_SERVICE_URL}/api/health"
    interval: 30s
    timeout: 10s
    expected_status: 200
    expected_body: '"status":"ok"'
    labels:
      service_type: api
      environment: "{ENVIRONMENT}"

  # ── Sync / Worker service (starter-worker) ───
  - name: "{PROJECT_NAME}-sync"
    url: "{SYNC_SERVICE_URL}/healthz"
    interval: 30s
    timeout: 10s
    expected_status: 200
    expected_body: '"status":"ok"'
    labels:
      service_type: worker
      environment: "{ENVIRONMENT}"

  # ── Gateway service (starter-gateway) ────────
  - name: "{PROJECT_NAME}-gateway"
    url: "{GATEWAY_SERVICE_URL}/v1/health"
    interval: 30s
    timeout: 10s
    expected_status: 200
    expected_body: '"status":"ok"'
    labels:
      service_type: gateway
      environment: "{ENVIRONMENT}"

