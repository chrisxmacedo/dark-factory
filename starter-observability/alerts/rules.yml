# Prometheus alerting rules
# Mount this file into Prometheus: /etc/prometheus/rules.yml
#
# To configure notifications, set up Alertmanager with your preferred channels.
# See commented-out notification config at the bottom of this file.

groups:
  - name: service_health
    interval: 30s
    rules:
      # ── High error rate ──────────────────────────
      # Fires when more than 5% of requests return errors over 5 minutes.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) by (service_name, deployment_environment)
            /
            sum(rate(http_server_request_duration_seconds_count[5m])) by (service_name, deployment_environment)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service_name }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%) in {{ $labels.deployment_environment }}."
          runbook: "{RUNBOOK_URL}/high-error-rate"

      # ── High latency ────────────────────────────
      # Fires when p99 latency exceeds 2 seconds over 5 minutes.
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name, deployment_environment)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency on {{ $labels.service_name }}"
          description: "p99 latency is {{ $value | humanizeDuration }} (threshold: 2s) in {{ $labels.deployment_environment }}."
          runbook: "{RUNBOOK_URL}/high-latency"

      # ── Service down ────────────────────────────
      # Fires when a service target is unreachable for 1 minute.
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 1 minute."
          runbook: "{RUNBOOK_URL}/service-down"

      # ── Disk space warning ──────────────────────
      # Fires when filesystem usage exceeds 80%.
      - alert: DiskSpaceWarning
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free (threshold: 20%)."
          runbook: "{RUNBOOK_URL}/disk-space"

