# infra/docker-compose.prod-parity.yml
# Persisted volumes. Full OTel -> Grafana stack. Real LLM API key.
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.prod-parity.yml up
# Requires: .env.prod-parity with real API keys and strong passwords
# WARNING: Uses real LLM API — costs real money. Run against synthetic data only.

name: {PROJECT_SLUG}-prod

services:

  # ── Persisted infrastructure ──────────────────────────────────────────────

  postgres:
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-prod-data:/data

  minio:
    volumes:
      - minio-prod-data:/data
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # ── Full OTel -> Grafana LGTM stack ────────────────────────────────────────
  # grafana/otel-lgtm: Loki + Grafana + Tempo + Prometheus in one image.
  # Validates the full observability pipeline:
  #   Traces:  service -> OTel Collector -> Tempo -> Grafana
  #   Logs:    service -> OTel Collector -> Loki -> Grafana (correlated by trace_id)
  #   Metrics: service -> OTel Collector -> Prometheus -> Grafana
  #
  # Grafana UI: http://localhost:{GRAFANA_PORT} (admin / GRAFANA_PASSWORD)
  # Choose a Grafana port that doesn't clash with your application services.
  # Pick a port that doesn't clash with your app (e.g. 4000 if web is on 3000).

  otel-collector:
    image: grafana/otel-lgtm:latest
    ports:
      - "{GRAFANA_PORT}:3000"   # Grafana UI
      - "4317:4317"             # OTel gRPC receiver
      - "4318:4318"             # OTel HTTP receiver
      - "9090:9090"             # Prometheus scrape endpoint
    volumes:
      - otel-prod-data:/data
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4318/v1/traces"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Exporters (add per infrastructure service) ─────────────────────────────

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://{PROJECT_SLUG}:${POSTGRES_PASSWORD}@postgres:5432/{PROJECT_SLUG}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Override application services for prod-parity ──────────────────────────
  # For each service:
  #   - Point LLM API at real provider (not stub)
  #   - Set ENVIRONMENT=prod-parity
  #   - Configure OTel endpoint to otel-collector
  #   - Set REDIS_URL with password
  #   - Optionally add replicas for load-balanced services
  #
  # {SERVICE_1}:
  #   deploy:
  #     replicas: 2
  #   environment:
  #     ENVIRONMENT: prod-parity
  #     {LLM_API_BASE_ENV_VAR}: {LLM_REAL_API_URL}
  #     {LLM_API_KEY_ENV_VAR}: ${LLM_API_KEY}
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  #     OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  #     LOG_LEVEL: debug
  #   depends_on:
  #     otel-collector:
  #       condition: service_healthy
  #     db-migrate:
  #       condition: service_completed_successfully

  # ── DB migrations ─────────────────────────────────────────────────────────

  db-migrate:
    build:
      context: ../{SERVICE_WITH_MIGRATIONS}
      dockerfile: Dockerfile
    command: ["{MIGRATION_COMMAND}"]
    environment:
      DATABASE_URL: postgresql://{PROJECT_SLUG}:${POSTGRES_PASSWORD}@postgres:5432/{PROJECT_SLUG}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-prod-data:
  redis-prod-data:
  minio-prod-data:
  otel-prod-data:
