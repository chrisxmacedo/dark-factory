# infra/docker-compose.ci.yml
# Ephemeral. Fast startup. No observability overhead.
# LLM API calls routed to stub server — no real API costs.
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.ci.yml up --wait

name: {PROJECT_SLUG}-ci

services:

  # ── Override infrastructure for CI ────────────────────────────────────────

  postgres:
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ci-password

  redis:
    tmpfs:
      - /data

  minio:
    tmpfs:
      - /data
    environment:
      MINIO_ROOT_PASSWORD: ci-password

  # ── LLM stub server ────────────────────────────────────────────────────────
  # Intercepts all LLM API calls and returns deterministic fixture responses.
  # Application services have their LLM API base URL pointed here.
  #
  # Anthropic SDK: set CLAUDE_API_BASE=http://llm-stub:11434
  # OpenAI SDK:    set OPENAI_API_BASE=http://llm-stub:11434/v1

  llm-stub:
    build:
      context: ../tests/mocks/llm_stub
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── DB migrations init container ──────────────────────────────────────────
  # Replace the build context and command with your migration tool:
  #   Prisma:   command: ["npx", "prisma", "migrate", "deploy"]
  #   Alembic:  command: ["alembic", "upgrade", "head"]
  #   Django:   command: ["python", "manage.py", "migrate"]

  db-migrate:
    build:
      context: ../{SERVICE_WITH_MIGRATIONS}
      dockerfile: Dockerfile
    command: ["{MIGRATION_COMMAND}"]
    environment:
      DATABASE_URL: postgresql://{PROJECT_SLUG}:ci-password@postgres:5432/{PROJECT_SLUG}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Override application services to point at stub ────────────────────────
  # For each application service that calls an LLM API, override its
  # environment to point at the stub server. Example:
  #
  # {SERVICE_1}:
  #   environment:
  #     {LLM_API_BASE_ENV_VAR}: http://llm-stub:11434   # or /v1 for OpenAI
  #     {LLM_API_KEY_ENV_VAR}: stub-key-not-real
  #     ENVIRONMENT: ci
  #   depends_on:
  #     llm-stub:
  #       condition: service_healthy
  #     db-migrate:
  #       condition: service_completed_successfully

  # ── No OTel collector in CI — stdout only ─────────────────────────────────
  # All services inherit OTEL_ENDPOINT=stdout from .env.ci
  # OTel SDK will fall back to stdout exporter when endpoint unreachable
