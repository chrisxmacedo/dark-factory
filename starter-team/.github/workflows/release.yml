name: Release Candidate

on:
  push:
    branches:
      - "release-rc-**"

jobs:
  regression:
    name: Full E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test environment (base + ci + test fixtures)
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.ci.yml \
            -f docker-compose.test.yml \
            --env-file .env.test \
            up --build --wait --wait-timeout 150

      # ── Unit tests (inside container) ────────────────────────────────────

      - name: Run unit tests
        run: |
          docker compose \
            -f infra/docker-compose.base.yml \
            -f infra/docker-compose.ci.yml \
            -f infra/docker-compose.test.yml \
            exec -T {SERVICE_WITH_TESTS} {UNIT_TEST_COMMAND}

      # ── Full E2E regression suite (from host against fixture data) ───────

      - name: Run E2E regression suite
        run: |
          {INSTALL_TEST_DEPS_COMMAND}
          {E2E_TEST_COMMAND}

      - name: Tear down
        if: always()
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.ci.yml \
            -f docker-compose.test.yml \
            down -v --remove-orphans

  prod-parity-gate:
    name: Prod-Parity Smoke Test (Manual Gate)
    runs-on: ubuntu-latest
    needs: regression
    environment: prod-parity  # Requires manual approval in GitHub Environments
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Write prod-parity env file
        run: |
          cat > infra/.env.prod-parity << EOF
          ENVIRONMENT=prod-parity
          POSTGRES_PASSWORD=${{ secrets.PROD_PARITY_POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD=${{ secrets.PROD_PARITY_MINIO_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.PROD_PARITY_REDIS_PASSWORD }}
          GRAFANA_PASSWORD=${{ secrets.PROD_PARITY_GRAFANA_PASSWORD }}
          SERVICE_VERSION=${{ github.sha }}
          EOF
          # Add your LLM API key secret:
          # echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> infra/.env.prod-parity
          # echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> infra/.env.prod-parity

      - name: Start prod-parity environment
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.prod-parity.yml \
            --env-file .env.prod-parity \
            up --build -d

      - name: Wait for services healthy
        run: |
          sleep 30
          curl --retry 20 --retry-delay 5 --retry-connrefused \
            http://localhost:{PRIMARY_SERVICE_PORT}/healthz

      - name: Run smoke tests
        run: |
          {INSTALL_TEST_DEPS_COMMAND}
          {SMOKE_TEST_COMMAND}

      - name: Tear down
        if: always()
        working-directory: infra
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.prod-parity.yml \
            down -v --remove-orphans
